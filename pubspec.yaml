name: mindmaps_app
description: "Quran Mind Maps"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  animated_custom_dropdown: ^3.1.1
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  dynamic_height_grid_view: ^0.0.4
  easy_localization: ^3.0.7+1
  equatable: ^2.0.7
  fl_chart: ^0.69.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_html: ^3.0.0-beta.2
  flutter_intl_phone_field: ^0.0.7
  flutter_svg: ^2.0.17
  flutter_widget_from_html: ^0.16.0
  get_it: ^8.0.3
  google_generative_ai: ^0.4.7
  image_picker: ^1.1.2
  liquid_progress_indicator_v2: ^0.5.0
  package_info_plus: ^8.3.0
  pin_code_fields: ^8.0.1
  pretty_dio_logger: ^1.4.0
  share_plus: ^11.0.0
  shared_preferences: ^2.5.3
  skeletonizer: ^1.4.3
  smooth_page_indicator: ^1.2.1

dev_dependencies:

  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/svgs/
    - assets/icons/
    - assets/fonts/
    - assets/images/
    - assets/translations/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/tajawal/Tajawal-Bold.ttf
          weight: 700
