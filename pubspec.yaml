name: mindmaps_app
description: "Quran Mind Maps"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_bloc: ^9.1.0
  shared_preferences: ^2.5.3
  easy_localization: ^3.0.7+1

  flutter_svg: ^2.0.17
  flutter_html: ^3.0.0-beta.2

  pin_code_fields: ^8.0.1
  image_picker: ^1.1.2
  flutter_intl_phone_field: ^0.0.7
  smooth_page_indicator: ^1.2.1
  package_info_plus: ^8.3.0
  dynamic_height_grid_view: ^0.0.4
  liquid_progress_indicator_v2: ^0.5.0
  animated_custom_dropdown: ^3.1.1
  flutter_widget_from_html: ^0.16.0
  skeletonizer: ^1.4.3
  flutter_screenutil: ^5.9.3

  # Networking
  dio: ^5.8.0+1
  get_it: ^8.0.3
  pretty_dio_logger: ^1.4.0
  google_generative_ai: ^0.4.7
  equatable: ^2.0.7
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/svgs/
    - assets/icons/
    - assets/fonts/
    - assets/images/
    - assets/translations/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/tajawal/Tajawal-Bold.ttf
          weight: 700